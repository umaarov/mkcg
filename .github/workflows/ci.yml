name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr libgomp1
      # OCRGate needs the Uzbek (Latin, Cyrillic) and Russian Tesseract models; the apt package only ships English.
      - uses: actions/cache@v4
        with:
          path: data/tessdata
          key: tessdata-fast-v1
      - run: sh scripts/get_tessdata.sh
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: cd apps/api && uv sync --frozen
      - run: cd apps/api && uv run pytest -q
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci --no-audit --no-fund
      - run: cd apps/web && npx tsc --noEmit
      - run: cd apps/web && npm run build
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: images build, stack starts, health endpoint answers
        env:
          CG_SECRET_KEY: ci-only-secret
        run: |
          docker compose build
          docker compose up -d
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3101/api/health && exit 0; sleep 3; done
          docker compose logs --tail 60; exit 1
