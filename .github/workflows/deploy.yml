# Deploys the repository to the server over SSH and records the run in GitHub's deployment history.
# Required repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY (private key), DEPLOY_PATH (e.g. /opt/creditgateway)
name: deploy
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: ssh setup
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: sync code
        run: rsync -az --delete --exclude .git --exclude .env --exclude apps/api/var -e "ssh -i ~/.ssh/id_deploy" ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
      - name: build and restart
        run: ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd ${{ secrets.DEPLOY_PATH }} && docker compose --profile tunnel up -d --build"
      - name: smoke test
        run: sleep 20 && ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "curl -fsS http://127.0.0.1:3101/api/health"
